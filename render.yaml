services:
  - type: web
    name: savetogether-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: savetogether-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: savetogether-redis
          property: connectionString

databases:
  - name: savetogether-db
    databaseName: savetogether_production
    user: savetogether_user
    plan: starter

  - type: redis
    name: savetogether-redis
    plan: starter
    ipAllowList: []
